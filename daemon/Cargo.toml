[package]
name = "screx"
version = "0.1.0"
edition = "2021"
description = "Low-latency Linux screen streaming daemon for Screx V2"
license = "MIT"

[lib]
name = "screx_vcam"
path = "src/platform/windows/vcam_filter/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
opus-decoder = "0.1"
ffmpeg-next = "8"
ffmpeg-sys-next = "8"
libc = "0.2"
reed-solomon-erasure = "6"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4.6.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display", "Win32_System_Registry",
  "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio", "Win32_Media_DirectShow", "Win32_Media_KernelStreaming",
  "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_SystemInformation",
  "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Security", "Win32_System_IO",
  "Win32_System_Memory",
]}
socket2 = { version = "0.5", features = ["all"] }
dirs = "5"
vigem-client = "0.1"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-media = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"

[build-dependencies]
cc = "1"
