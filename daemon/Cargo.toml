[package]
name = "screx"
version = "0.1.0"
edition = "2021"
description = "Low-latency Linux screen streaming daemon for Screx V2"
license = "MIT"

[dependencies]
anyhow = "1"
opus-decoder = "0.1"
ffmpeg-next = "8"
ffmpeg-sys-next = "8"
libc = "0.2"
rand = "0.8"
reed-solomon-erasure = "6"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.0", features = ["derive"] }

[build-dependencies]
cc = "1"
