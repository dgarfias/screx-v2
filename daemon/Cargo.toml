[package]
name = "screx-daemon"
version = "0.1.0"
edition = "2021"
description = "Low-latency Linux screen streaming daemon for Screx V2"
license = "MIT"

[features]
default = []
real-capture = ["dep:ashpd", "dep:pipewire"]
real-encode = ["dep:ffmpeg-next"]
rtp-crate = ["dep:rtp"]

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", optional = true, features = ["screencast"] }
ffmpeg-next = { version = "8", optional = true }
pipewire = { version = "0.9", optional = true }
rand = "0.8"
rtp = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
