[package]
name = "screx"
version = "0.1.0"
edition = "2021"
description = "Low-latency screen streaming daemon for Screx V2"
license = "MIT"

[dependencies]
anyhow = "1"
opus = "0.3"
ffmpeg-next = "9"
ffmpeg-sys-next = "9"
libc = "0.2"
reed-solomon-erasure = "6"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4.6.0", features = ["derive"] }

[build-dependencies]
cc = "1"
