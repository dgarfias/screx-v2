[package]
name = "screx-desktop"
version = "0.1.0"
edition = "2021"
description = "Cross-platform desktop client for Screx"
license = "MIT"

[dependencies]
anyhow = "1"
cpal = "0.17"
cpp = "0.5"
dirs = "6"
ffmpeg-sys-next = "8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
nokhwa = { version = "0.10", features = ["input-native"] }
opus = "0.3"
qmetaobject = "0.2.10"
qttypes = "0.2"
reed-solomon-erasure = "6"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cpp_build = "0.5"
semver = "1"

[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
winresource = "0.1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
